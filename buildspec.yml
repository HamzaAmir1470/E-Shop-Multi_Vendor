version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building Backend Docker image...
      - docker build -t e-shop/backend ./backend
      - docker tag e-shop/backend:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/backend:latest
      
      - echo Building Socket Docker image...
      - docker build -t e-shop/socket ./socket
      - docker tag e-shop/socket:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/socket:latest
      
      - echo Building Frontend Production Docker image...
      - docker build --build-arg VITE_SERVER_URL=$VITE_SERVER_URL -t e-shop/frontend -f ./frontend/Dockerfile.prod ./frontend
      - docker tag e-shop/frontend:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/frontend:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Docker images to ECR...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/backend:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/socket:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/e-shop/frontend:latest
artifacts:
  files:
    - docker-compose.prod.yml