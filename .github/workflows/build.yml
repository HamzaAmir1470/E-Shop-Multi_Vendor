name: Docker MERN CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ----------------------------------------------------
      # CRITICAL FIX STEP: Fix folder naming dynamically
      # ----------------------------------------------------
      - name: Standardize Casing and Create Mock Environment
        run: |
          # 1. Dynamically fix BackEnd path if it's lowercase in the runner
          if [ -d "backend" ]; then mv backend BackEnd; fi
          
          # 2. Dynamically fix FrontEnd path if it's lowercase in the runner
          if [ -d "frontend" ]; then mv frontend FrontEnd; fi
          
          # 3. Ensure the environment directories and mockup file exist
          mkdir -p BackEnd/config
          touch BackEnd/config/.env

      - name: Build Docker Services
        env:
          AWS_ACCOUNT_ID: "123456789012"
          AWS_REGION: "us-east-1"
        run: |
          docker compose build

      - name: Start Services
        env:
          AWS_ACCOUNT_ID: "123456789012"
          AWS_REGION: "us-east-1"
        run: |
          docker compose up -d

      - name: Verify Running Containers
        run: |
          docker ps
          
      - name: Run Tests (Optional)
        run: |
          echo "Services built and verified successfully!"

      - name: Stop Services
        if: always()
        env:
          AWS_ACCOUNT_ID: "123456789012"
          AWS_REGION: "us-east-1"
        run: |
          docker compose down