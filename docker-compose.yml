version: '3.8'

services:
  # --- BACKEND SERVICE ---
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/e-shop/backend:latest
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./BackEnd/config/.env
    environment:
      - NODE_ENV=production
    networks:
      - eshop-network

  # --- SOCKET SERVICE ---
  socket:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/e-shop/socket:latest
    build:
      context: ./socket
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    networks:
      - eshop-network

  # --- FRONTEND SERVICE ---
  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/e-shop/frontend:latest
    build:
      context: ./FrontEnd             # Must be capital E
      dockerfile: Dockerfile.prod     # Matches your exact file name
      args:
        - VITE_SERVER_URL=http://your-ec2-public-ip:8000
        - VITE_FRONTEND_URL=http://your-ec2-public-ip
    ports:
      - "80:80"
    networks:
      - eshop-network
    depends_on:
      - backend
      - socket

networks:
  eshop-network:
    driver: bridge